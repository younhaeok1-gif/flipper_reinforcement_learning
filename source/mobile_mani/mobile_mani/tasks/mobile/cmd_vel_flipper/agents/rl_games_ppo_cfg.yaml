params:
  seed: 42

  env:
    num_envs: 2048
    clip_observations: 5.0
    clip_actions: 1.0

  # 알고리즘 설정
  algo:
    name: a2c_continuous

  # 모델 구조 (신경망)
  model:
    name: continuous_a2c_logstd

  # 신경망 네트워크 설정
  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0.0
        fixed_sigma: True
    mlp:
      units: [256, 128, 64]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  # PPO 하이퍼파라미터
  config:
    name: MobileCmdVelFlipper_PPO
    env_name: ISAAC_LAB
    device: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: 128
    reward_shaper:
      scale_value: 0.1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 20000
    max_epochs: 1500
    save_best_after: 100
    save_frequency: 50
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 24
    minibatch_size: 4096
    mini_epochs: 5
    critic_coef: 2.0
    clip_value: True
    seq_len: 4
    bounds_loss_coef: 0.0001
